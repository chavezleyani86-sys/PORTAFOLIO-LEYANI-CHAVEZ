trigger:
  - main # Se dispara automáticamente al hacer push a la rama main

pool:
  vmImage: 'windows-2022'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  serviceConnection: 'azure-portafolio-connection'
  webAppName: 'leyani' # Nombre de tu Web App en Azure
  webAppType: 'webApp' # Windows (confirmado en Azure)

stages:
# 1. ETAPA DE COMPILACIÓN (CI)
- stage: Build
  displayName: 'Compilación y Publicación'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Publicar proyecto web'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefacto'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2. ETAPA DE DESPLIEGUE (CD)
- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar artefacto'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Desplegar a Azure Web App'
      inputs:
        azureSubscription: '$(serviceConnection)'
        appType: '$(webAppType)'
        appName: '$(webAppName)'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'
